apiVersion: apps/v1
kind: Deployment
metadata: 
  name: vote-deployment
  namespace: ironhack-project-2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vote-app
  template:
    metadata:
      labels:
        app: vote-app
    spec:
      containers:
        - name: vote-container
          image: akemloh/vote
          env:
            - name: REDIS_HOST
              value: "redis-master"
            - name: REDIS_PORT
              value: "6379"
          ports:
           - containerPort: 80
       